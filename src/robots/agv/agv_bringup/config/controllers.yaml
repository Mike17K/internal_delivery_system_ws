/$(var namespace):
  controller_manager:
    ros__parameters:
      update_rate: 100

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      diff_drive_controller:
        type: diff_drive_controller/DiffDriveController

  diff_drive_controller:
    ros__parameters:
      # Bare joint names: robot_description's URDF joints are unprefixed
      # (see agv_description/urdf/agv_macro.xacro) - this controller_manager
      # instance already runs scoped to this one robot's own namespace
      # (the "/$(var namespace):" wrapper above), so there's no ambiguity
      # to resolve by prefixing the joint name itself.
      left_wheel_names: ["wheel_left_joint"]
      right_wheel_names: ["wheel_right_joint"]

      # From the AGVv3 export (wheel joint Y offsets: +0.14 / -0.14, and
      # cylinder radius 0.02011 - see agv_description/urdf/agv_macro.xacro).
      wheel_separation: 0.28
      wheel_radius: 0.02011

      publish_rate: 50.0

      # ── Frame ids: bare names, leading slash, prefixing off ───────────────
      # This fleet disambiguates robots by tf TOPIC (/<namespace>/tf), never
      # by frame-name text - see docs/agv-fleet/02-bringup-and-simulation.md.
      # Two settings are needed to actually get that, and they were arrived
      # at from a live failure, so don't "simplify" either without re-testing
      # with `ros2 run tf2_tools view_frames --ros-args -r tf:=/agv_1/tf`:
      #
      # 1. tf_frame_prefix_enable: false
      #    diff_drive_controller defaults this to TRUE, and when
      #    tf_frame_prefix is empty it falls back to the controller node's
      #    namespace. Left at the default it broadcast
      #    "agv_1/odom -> agv_1/base_link" while robot_state_publisher
      #    (whose own frame_prefix defaults to "") broadcast
      #    "base_link -> {wheel_*, caster_*, lidar_link}" - two disjoint
      #    trees on the same topic, confirmed with view_frames. Nav2's
      #    "Invalid frame ID 'odom'" was the honest result: no frame named
      #    plain "odom" existed anywhere.
      #
      # 2. The leading "/" on the two values below.
      #    tf2 strips a leading slash from frame ids on receipt
      #    (BufferCore::setTransform), so these arrive as "base_link" and
      #    "odom" - matching robot_state_publisher and nav2_params.yaml. It
      #    also makes the values immune to any prefix being re-concatenated
      #    in front of them by a future default change. This is the form
      #    that was verified working on a live run; bare names are expected
      #    to behave identically given (1), but that combination was not the
      #    one tested.
      base_frame_id: "/base_link"
      odom_frame_id: "/odom"

      tf_frame_prefix_enable: false

      # diff_drive_controller is the standard, correct source for
      # odom -> base_link (integrated from commanded wheel motion) - what
      # Nav2/AMCL/SLAM expect. PosePublisher's tf output is not bridged into
      # ROS (see gz_bridge.yaml) to avoid it also claiming a conflicting
      # (ground-truth-relative) parent for base_link.
      #
      # This flag is one of THREE things that all have to be right before a
      # usable odom -> base_link exists. It took several live runs to find
      # them all, each one producing the identical
      # "Invalid frame ID 'odom' ... frame does not exist" from Nav2, so if
      # that message ever returns, check all three before anything else:
      #
      #   1. enable_odom_tf: true (here) - turns the broadcaster on at all.
      #   2. The tf topic. The broadcaster hardcodes an absolute "/tf" and
      #      neither this file nor any launch-file remapping can redirect
      #      it, because a controller is a node built inside
      #      controller_manager's process, not a process of its own. The
      #      redirect onto /<namespace>/tf comes from the spawner's
      #      "controller ros args" in agv_bringup/launch/bringup.launch.py.
      #   3. The frame names. See the tf_frame_prefix_enable block above.
      #
      # And separately from all three, the controller publishes no odometry
      # at all until it has received one velocity command - see the
      # odom_bootstrap action in bringup.launch.py.
      enable_odom_tf: true

      # Deadman switch, not a latency knob. diff_drive_controller keeps
      # applying the last command it received until this much time has
      # passed with no new one, then writes zeros to the wheels. It has to
      # exist: cmd_vel is a stream of *setpoints* with no "stop" implied by
      # silence, so without a timeout a commander that crashes, is Ctrl-C'd,
      # loses its network, or gets starved by the sim leaves the AGV driving
      # at its last velocity forever, into whatever is in front of it.
      #
      # Smaller is therefore SAFER, not faster - it does not reduce the
      # latency of commands you actually send, it shortens how long a
      # runaway lasts. The floor is set by the command rate: at teleop_ui's
      # 20 Hz (50 ms) and Nav2's controller_frequency of 20 Hz, 0.25 s is
      # five missed messages of slack, which absorbs a scheduling hiccup
      # under software rendering without cutting motion short. Don't take it
      # below ~5x the slowest commander's period or the robot will stutter
      # whenever the sim's RTF dips.
      #
      # Lowered from 0.5 s, which was tuned for nothing in particular and
      # only ever became visible because ros2's teleop_twist_keyboard sends
      # one message per keypress - making the timeout, rather than the
      # released key, the thing that stopped the robot. teleop_ui.py
      # publishes continuously and zeros on release, so that is no longer
      # what this value is for.
      cmd_vel_timeout: 0.25
      # NOTE: no `use_stamped_vel` - it was removed from diff_drive_controller
      # (4.x), which accepts geometry_msgs/TwistStamped on ~/cmd_vel and
      # nothing else. Nav2's matching `enable_stamped_cmd_vel: true` is set in
      # agv_navigation/config/nav2_params.yaml; the two must agree or cmd_vel
      # connects by topic name and then silently never delivers a message.
      # Confirmed on a live run: bringup.launch.py's odom_bootstrap publishes
      # TwistStamped and the controller acted on it (odometry started
      # flowing), so this side of the contract is settled.
