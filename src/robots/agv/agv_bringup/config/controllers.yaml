/$(var namespace):
  controller_manager:
    ros__parameters:
      update_rate: 100

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      diff_drive_controller:
        type: diff_drive_controller/DiffDriveController

  diff_drive_controller:
    ros__parameters:
      # Bare joint names: robot_description's URDF joints are unprefixed
      # (see agv_description/urdf/agv_macro.xacro) - this controller_manager
      # instance already runs scoped to this one robot's own namespace
      # (the "/$(var namespace):" wrapper above), so there's no ambiguity
      # to resolve by prefixing the joint name itself.
      left_wheel_names: ["wheel_left_joint"]
      right_wheel_names: ["wheel_right_joint"]

      # From the AGVv3 export (wheel joint Y offsets: +0.14 / -0.14, and
      # cylinder radius 0.02011 - see agv_description/urdf/agv_macro.xacro).
      wheel_separation: 0.28
      wheel_radius: 0.02011

      publish_rate: 50.0
      # Bare frame ids: this robot's own /<namespace>/tf topic is what
      # disambiguates it from other robots, not the frame name text - see
      # docs/agv-fleet/02-bringup-and-simulation.md.
      base_frame_id: "base_link"
      odom_frame_id: "odom"

      # TF is published by the Gazebo PosePublisher plugin instead (see
      # gz_bridge.yaml), same convention as group_a, to avoid two competing
      # broadcasters for the same frames.
      enable_odom_tf: false

      cmd_vel_timeout: 0.5
      use_stamped_vel: false
