# SLAM Toolbox (online async) params, used when navigation.launch.py is
# started with slam:=true - for building the initial map of office_world by
# driving one robot around (e.g. via teleop) before switching the fleet over
# to slam:=false (shared map_server + per-robot AMCL) for normal operation.
#
# Only meant to run on ONE robot at a time: this robot's slam_toolbox is the
# map authority while mapping (no separate map_server runs in slam:=true
# mode - see localization.launch.py), publishing map -> odom on its OWN
# /<namespace>/tf (remapped in navigation.launch.py). Running two SLAM
# instances at once would each think they own "map" on their own topic,
# which doesn't fuse into one map - map two robots' worth of environment by
# driving them one at a time.
#
# odom_frame/base_frame are bare ("odom"/"base_link"), matching
# ../config/nav2_params.yaml's convention - see navigation.launch.py.

slam_toolbox:
  ros__parameters:
    use_sim_time: True

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: "odom"
    map_frame: map
    base_frame: "base_link"
    scan_topic: scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 5.0
    resolution: 0.05
    # 0.0 let the chassis' own body (nothing physically stops a lidar
    # return closer than the robot's own radius) count as a scan point.
    # AGVv3's footprint half-diagonal is ~0.22m; 0.15 clears any self-hit
    # with margin without cutting into real near-wall returns.
    min_laser_range: 0.15
    max_laser_range: 20.0
    minimum_time_interval: 0.5
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    # Were 0.5/0.5 (rad/m) - a threshold tuned for a much bigger space than
    # office_world's ~4m rooms and 2.4m corridor. At that spacing, a whole
    # small room could be crossed between pose-graph nodes; halving it
    # gives scan-matching more correction points and tighter loop closures
    # at this building's actual scale. Tradeoff: a denser graph costs more
    # CPU/memory per map_update_interval.
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    # How far away (meters, pose-graph distance) a loop closure candidate
    # is even considered from - was 3.0. Shrunk together with
    # loop_search_space_dimension below so a loop closure can only ever
    # propose a correction within a small neighborhood of the current
    # belief, not a jump sourced from matching against the whole map (see
    # that param's comment for why office_world specifically makes a wide
    # search dangerous here).
    loop_search_maximum_distance: 1.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    # office_world has several near-identical rooms/corridor bays in a
    # row - classic perceptual-aliasing territory, where slam_toolbox can
    # loop-close two *different* rooms it mistakes for the same one.
    # Raised (tighter, i.e. requires a more confident match) rather than
    # loosened, opposite direction from the travel-distance change above:
    # tradeoff is a genuine loop closure occasionally needs a bit more
    # corroborating overlap before it's accepted.
    loop_match_maximum_variance_coarse: 2.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55

    # Correlation Parameters - Correlation Parameters
    # correlation_search_space_dimension is how far (meters) around
    # odometry's own current estimate the scan matcher is even allowed to
    # look for a correction each update - the actual bound on "how big can
    # one correction be." 0.5 -> 0.3 keeps it tighter: enough to correct
    # ordinary wheel-slip-scale drift, not enough to snap somewhere else
    # the map happens to look similar. If a wheel drifts further than this
    # in one update, scan matching just fails to find a match that update
    # and falls back to odometry rather than forcing a bad correction - a
    # missed correction, not a wrong one.
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    # loop_search_maximum_distance (nearer the top of this file, General
    # Parameters) and loop_search_space_dimension are loop closure's own,
    # much larger-radius version of the same "how far can one correction
    # reach" question - a loop closure explicitly searches the pose graph
    # for anywhere that looks like a match, not just nearby, which is
    # exactly the "correction from all the map instead of a local range"
    # failure mode: in office_world's repeated near-identical rooms, it can
    # find and confidently snap to the WRONG room. Both shrunk from
    # 3.0/8.0 so loop closure only ever proposes a jump within a small
    # neighborhood of where dead-reckoning already thinks the robot is.
    loop_search_space_dimension: 3.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    # distance_variance_penalty raised 0.5 -> 1.0: this penalizes a
    # candidate correction by how far it sits from odometry's own
    # prediction, so raising it makes the matcher trust odometry's
    # short-term estimate more and a big proposed jump score worse
    # relative to a small one - reinforcing correlation_search_space_
    # dimension's hard radius cap with a softer preference for whichever
    # in-range correction is smallest.
    distance_variance_penalty: 1.0
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
