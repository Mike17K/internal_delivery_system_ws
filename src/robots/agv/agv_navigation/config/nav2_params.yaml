# Per-robot Nav2 params template for the AGV fleet.
#
# TF convention: standard Nav2/ROS 2 multi-robot pattern - each robot's nodes
# run in their own namespace and publish/consume tf on their OWN
# /<namespace>/tf topic (remapped in navigation.launch.py; robot_state_
# publisher gets the same remap in agv_bringup/launch/bringup.launch.py, and
# diff_drive_controller gets it via the spawner's "controller ros args" -
# see docs/agv-fleet/02-bringup-and-simulation.md's "Fleet TF strategy").
# So:
#   - frame ids below (base_frame_id, robot_base_frame, ...) are bare
#     ("base_link", "odom") - never prefixed with the namespace. The SAME
#     file is used unmodified for every robot; nothing in it needs to differ
#     per robot except via $(var ...) substitution for genuinely per-robot
#     VALUES (initial pose - see amcl.initial_pose below).
#     This only works because every PUBLISHER on the topic also uses bare
#     names. diff_drive_controller does not by default - it prefixes frame
#     ids with its namespace unless tf_frame_prefix_enable is false, which
#     is why agv_bringup/config/controllers.yaml sets it. If frames here
#     ever stop resolving, check that first.
#   - "map" is left bare everywhere too - the one frame actually shared by
#     the whole fleet (one map_server, see localization.launch.py), living
#     on each robot's own /<namespace>/tf as the root of that robot's local
#     map -> odom -> base_link chain. Comparing robots' positions against
#     each other (or against a fleet-wide "map") requires an aggregator/relay
#     node reading each robot's own tf and republishing centrally - not
#     implemented here, see docs/agv-fleet/04-known-issues-and-next-steps.md.
#
# $(var namespace) / $(var initial_pose_*) tokens are still used, but only
# for values that are genuinely per-robot (not frame ids) - resolved at
# launch time by navigation.launch.py via ParameterFile(..., allow_substs=True),
# the same mechanism agv_bringup/config/controllers.yaml uses.
#
# Node namespacing (for the "amcl:", "controller_server:" etc. top-level
# keys below to correctly match a node actually running as e.g.
# "/agv_1/amcl") is handled by nav2_common.launch.RewrittenYaml's root_key
# nesting in the launch file, applied as a second pass after the
# $(var ...) substitution above.

amcl:
  ros__parameters:
    use_sim_time: True
    # alpha1-4 (odom_model_type: "diff", so alpha5 - the omni strafe term -
    # is unused) were all 0.2: how much the motion model spreads particles
    # per update, proportional to the commanded motion. A physical bump
    # (hitting a wall/another robot) moves the base in a way the motion
    # model never predicted from odometry alone, so a small alpha keeps the
    # particle cloud too tight to recover - the filter stays confident in
    # the wrong pose instead of admitting uncertainty and re-spreading.
    # Slightly wider tolerates that without materially hurting normal-drive
    # precision.
    alpha1: 0.3
    alpha2: 0.3
    alpha3: 0.3
    alpha4: 0.3
    alpha5: 0.2
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 30.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_model_type: "diff"
    pf_err: 0.05
    pf_z: 0.99
    # Augmented MCL recovery - both were 0.0, which fully disables it. This
    # is the actual mechanism AMCL has for "the particle filter's average
    # likelihood just dropped, inject random particles to re-find the
    # robot" - exactly the collide-then-lose-track case. 0.0 means a
    # collision that knocks the estimate off has no way back short of a
    # manual re-localization; these are nav2's own commonly-used non-zero
    # defaults, not aggressive tuning.
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # Were 0.2/0.25 - the minimum rotation/distance since the last update
    # before AMCL will re-weight/resample at all. Lower means it corrects
    # against the laser sooner after a bump instead of coasting on the
    # (now wrong) motion-model prediction for up to a quarter meter/~11
    # degrees of further drift first.
    update_min_a: 0.1
    update_min_d: 0.15
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    map_topic: /map # rewritten per mode at launch time (relative "map" under slam:=true) - see navigation.launch.py
    set_initial_pose: true
    # Resolved per robot at launch time from the initial_pose_x/y/yaw launch
    # args (see navigation.launch.py) - each robot spawns at a different
    # point, per workcell_bringup's robots_config.
    initial_pose:
      x: $(var initial_pose_x)
      y: $(var initial_pose_y)
      z: 0.0
      yaw: $(var initial_pose_yaw)

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: "base_link"
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # default_nav_to_pose_bt_xml / default_nav_through_poses_bt_xml left unset:
    # nav2_bt_navigator falls back to its own bundled default trees when omitted.
    #
    # plugin_lib_names deliberately NOT set: an explicit 49-entry list (copied
    # from an older nav2 reference config where it was required) caused a hard
    # crash here - "Exception: ID [ComputePathToPose] already registered",
    # SIGSEGV - on BOTH robots, immediately on bt_navigator's first configure.
    # Current nav2_bt_navigator (Jazzy) auto-registers its own core BT node
    # set internally; an explicit list that overlaps with that (which any
    # reasonably complete list will) collides with it. Omit it and let
    # nav2_bt_navigator use its own default registration.
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    # diff_drive_controller 4.x accepts ONLY geometry_msgs/TwistStamped on its
    # ~/cmd_vel (use_stamped_vel is gone - see agv_bringup/config/
    # controllers.yaml). Nav2 defaults to unstamped Twist, which would connect
    # by topic name and silently never deliver a message. Set on every node in
    # this file that emits a velocity command: here, behavior_server (spin/
    # backup drive the base directly) and velocity_smoother.
    enable_stamped_cmd_vel: true
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25
    # Regulated Pure Pursuit: a well-supported, dependency-light default for a
    # small diff-drive base. Swapping controller_plugins/FollowPath.plugin to
    # nav2_mppi_controller::MPPIController (as sketched in the RMF fleet
    # integration guide) is a config-only change if/when needed later.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      max_linear_accel: 1.0
      max_linear_decel: 1.0
      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      # Was 1.0s: at desired_linear_vel 0.3 m/s that's a 0.3m lookahead -
      # shorter than fleet_obstacle_broadcaster's robot_radius (0.45m,
      # agv_navigation/scripts/), so a robot would already be INSIDE the
      # other robot's marked safety margin before use_collision_detection
      # even predicted a collision. 2.0s (~0.6m) gives it a real chance to
      # slow down before entering that margin instead of at its edge.
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      # Was false. use_collision_detection above only refuses a trajectory
      # that's ALREADY heading for a collision - a hard, late, all-or-
      # nothing check that reads as "steers a little, then hits anyway"
      # against another robot that's still moving (unlike a wall, it keeps
      # closing the gap between one costmap update and the next). Cost-
      # regulated scaling instead ramps speed down continuously as costmap
      # cost rises near ANY obstacle - walls and the fleet_obstacle_layer's
      # robot cylinders alike - so it's already slow well before getting
      # close enough for that hard check to matter. inflation_cost_scaling_
      # factor must match local_costmap/global_costmap's inflation_layer
      # (nav2_params.yaml, both) - it's how this converts a raw cost back
      # into a distance estimate; a mismatch here reads the wrong distance
      # off the same costmap.
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      regulated_linear_scaling_min_radius: 0.6
      regulated_linear_scaling_min_speed: 0.08
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: "odom"
      robot_base_frame: "base_link"
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # AGVv3's actual footprint (agv_description/urdf/agv_macro.xacro
      # base_link box: 0.35177 x 0.25126, halved and rounded).
      footprint: "[[0.176, 0.126], [0.176, -0.126], [-0.176, -0.126], [-0.176, 0.126]]"
      plugins: ["obstacle_layer", "fleet_obstacle_layer", "inflation_layer"]
      # inflation_radius/cost_scaling_factor were 0.3/3.0 originally (path
      # ran the corridor centerline - too much clearance for a robot meant
      # to leave room for people to cross), then tightened to 0.15/8.0,
      # which went too far the other way: robots were skimming close enough
      # to actually catch/stick on walls. 0.22/5.0 backs off partway - still
      # noticeably closer to the wall than the original, but with enough
      # margin that a small tracking wobble doesn't turn into a scrape. The
      # footprint collision check (a hard constraint, independent of
      # inflation) refuses any pose that would actually clip the wall
      # regardless of this value either way.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.22
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      # Other fleet members as cylindrical obstacles - see
      # agv_navigation/scripts/fleet_obstacle_broadcaster.py and
      # docs/agv-fleet/04-known-issues-and-next-steps.md's "No fleet-wide
      # TF view". Its cloud is stamped "map", the one frame this robot's
      # own AMCL agrees with the rest of the fleet on numerically; that's
      # also why obstacle_max_range/raytrace_max_range are building-scale
      # (100m) here, not sensor-scale like "scan" above - both are
      # measured from that frame's origin (0, 0), not from this robot,
      # since a synthetic cloud has no physical sensor location of its own.
      fleet_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: other_robots
        other_robots:
          topic: "/$(var namespace)/fleet_obstacles"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 100.0
          raytrace_min_range: 0.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: "base_link"
      # Were 1.0/1.0 - fine for static walls, slow for another robot that
      # actually moves between updates. Doesn't replan the path by itself
      # (bt_navigator's BT controls that cadence), but a stale costmap
      # means even a fresh replan is routing around where the other robot
      # WAS, not where it is now.
      update_frequency: 3.0
      publish_frequency: 3.0
      footprint: "[[0.176, 0.126], [0.176, -0.126], [-0.176, -0.126], [-0.176, 0.126]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "fleet_obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      # See local_costmap's fleet_obstacle_layer above - same source,
      # global_frame is already "map" here so it applies with no transform
      # at all, letting the global planner route around the rest of the
      # fleet instead of just the local controller dodging it late.
      fleet_obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: other_robots
        other_robots:
          topic: "/$(var namespace)/fleet_obstacles"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
          raytrace_max_range: 100.0
          raytrace_min_range: 0.0
          obstacle_max_range: 100.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        map_topic: /map # rewritten per mode at launch time - see navigation.launch.py
      # See local_costmap's inflation_layer above for the same 0.22/5.0 -
      # matters here too since NavfnPlanner (global_costmap) is what
      # actually threads the path off-center in the first place; the local
      # costmap's own inflation only shapes the controller's fine-tracking
      # of whatever path the planner already committed to.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.22
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    enable_stamped_cmd_vel: true # see controller_server above
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: "odom"
    robot_base_frame: "base_link"
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    enable_stamped_cmd_vel: true # see controller_server above
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Matches the AGV's diff_drive_controller command range - see
    # agv_bringup/config/controllers.yaml.
    max_velocity: [0.5, 0.0, 1.5]
    min_velocity: [-0.5, 0.0, -1.5]
    max_accel: [1.0, 0.0, 2.0]
    max_decel: [-1.0, 0.0, -2.0]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
